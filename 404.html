<!DOCTYPE html>
<html lang="fr-CA">
<head>

<title>Page introuvable | Margot Marion, courtière hypothécaire stagiaire</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bleu:#0066CC;--bleu-nuit:#003D7A;--vert:#4CB07F;--encre:#1A1A1A;--blanc:#FFFFFF;--brume:#F0F4F1;--gris:rgba(26,26,26,.62)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--brume);color:var(--encre);font-family:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.carte{max-width:560px;width:100%;background:var(--blanc);border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 16px 40px rgba(26,26,26,.08)}
.carte picture{display:block;margin:0 auto 26px}.carte img{height:72px;width:auto;margin:0 auto;display:block}
h1{font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-.02em;font-size:1.7rem;line-height:1.2;margin:0 0 12px}
p{margin:0 0 26px;color:rgba(26,26,26,.75)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bouton{display:inline-block;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-weight:700;text-decoration:none;padding:14px 24px;border-radius:10px;background:var(--bleu);color:var(--blanc)}
.bouton:hover{background:var(--bleu-nuit)}
.lien{display:inline-block;padding:14px 18px;color:var(--bleu);font-weight:600;text-decoration:none}
footer{text-align:center;font-size:.85rem;color:var(--gris);padding:0 24px 28px}
</style>
</head>
<body>
<main>
  <div class="carte">
    <picture><source srcset="/img/logo-xperto-dominion.webp" type="image/webp"><img src="/img/logo-xperto-dominion.png" alt="Xperto Groupe Héritage et Centres Hypothécaires Dominion National" width="640" height="276"></picture>
    <h1>Cette page est introuvable</h1>
    <p>L'adresse a peut-être changé ou contient une faute de frappe.
       Vous trouverez tout ce qu'il vous faut sur la page d'accueil.</p>
    <div class="actions">
      <a class="bouton" href="/">Retour à l'accueil</a>
      <a class="lien" href="tel:+15142484361">514-248-4361</a>
    </div>
  </div>
</main>
<footer>Margot Marion, courtière hypothécaire stagiaire · Laval</footer>
</body>
